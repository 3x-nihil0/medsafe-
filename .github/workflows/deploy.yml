# Deploys the static PWA to GitHub Pages on every push to main.
# One-time setup: repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Attach the build to the github-pages environment so secrets stored
    # either at repository level or on that environment are both visible.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck + rule-engine tests + production bundle
      # VITE_* values are baked into the bundle at build time, so the care-team
      # layer only works on the live site if these repository secrets are set
      # (Settings -> Secrets and variables -> Actions). Missing secrets fall
      # back to single-device mode instead of failing the build.
      - name: Build
        run: |
          # GitHub expands a missing secret to an empty string, and Vite lets
          # an empty-but-defined variable beat .env.production. Unset the
          # empties so the committed publishable keys act as the fallback;
          # real repository/environment secrets stay exported and win.
          [ -z "$VITE_SUPABASE_URL" ] && unset VITE_SUPABASE_URL || true
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && unset VITE_SUPABASE_ANON_KEY || true
          echo "care-team env: $([ -n "$VITE_SUPABASE_URL" ] && echo 'from secrets' || echo 'from .env.production')"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
