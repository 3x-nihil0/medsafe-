<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="medSafeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle / shield base -->
  <rect width="512" height="512" rx="112" fill="url(#medSafeGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Shield Shape inside safe zone (padding 15%) -->
  <g transform="translate(256, 256)" filter="url(#medSafeShadow)">
    <!-- Protective Shield Silhouette -->
    <path d="M 0,-140 C 70,-140 130,-115 130,-50 C 130,55 60,135 0,165 C -60,135 -130,55 -130,-50 C -130,-115 -70,-140 0,-140 Z" fill="#ffffff" />
    
    <!-- Medical Cross inside the Shield (Deep Teal) -->
    <rect x="-22" y="-85" width="44" height="120" rx="10" fill="#0f766e" />
    <rect x="-60" y="-47" width="120" height="44" rx="10" fill="#0f766e" />

    <!-- Pulse Line across center -->
    <path d="M -90,-25 L -40,-25 L -20,-50 L 0,0 L 20,-50 L 40,-25 L 90,-25" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  </g>
</svg>
