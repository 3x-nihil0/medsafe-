# Netlify build settings - works with `npx netlify deploy --prod`
# or by dragging the repo (or just the dist folder) onto https://app.netlify.com/drop
[build]
  command = "npm run build"
  publish = "dist"

# The service worker and manifest must never be served stale, otherwise an
# update would not reach an installed app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets are immutable and safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
